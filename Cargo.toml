[workspace]
resolver = "2"

members = [
    "crates/common",
    "crates/blockchain-core",
    "crates/crypto",
    "crates/voting",
    "crates/network",
    "crates/node",
    "crates/storage",
    "crates/rpc",
    "crates/cli",
    "crates/analytics",
    "binaries/validator-node",
    "binaries/full-node",
    "binaries/light-node",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Voting Core Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/voting-core/blockchain-voting"
homepage = "https://github.com/voting-core/blockchain-voting"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# Networking
libp2p = { version = "0.53", features = ["tcp", "noise", "mplex", "yamux", "gossipsub", "kad"] }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Cryptography
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
blake2 = "0.10"
sha3 = "0.10"
chacha20poly1305 = "0.10"
rand = "0.8"
rand_core = "0.6"

# Database
rocksdb = "0.22"
sled = "0.34"

# Configuration
toml = "0.8"

# Time
chrono = "0.4"

# Collections
dashmap = "5.5"

# Metrics
prometheus = "0.13"

# Command line
clap = { version = "4.4", features = ["derive"] }

# HTTP and RPC
hyper = { version = "0.14", features = ["full"] }
tower = "0.4"

# Testing
criterion = "0.5"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.bench]
inherits = "release"
