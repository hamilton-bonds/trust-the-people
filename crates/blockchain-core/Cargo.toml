[package]
name = "blockchain-core"
version = "0.1.0"
edition = "2021"
authors = ["Voting System Contributors"]
description = "Core blockchain implementation for the voting system"
license = "MIT"

[dependencies]
# Local dependencies
common = { path = "../common" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Cryptography
blake2 = "0.10"

# Random
rand = "0.8"

# Error handling
thiserror = "1.0"

[dev-dependencies]
# Testing
tokio-test = "0.4"
