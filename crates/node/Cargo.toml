[package]
name = "node"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Voting System Contributors"]
description = "Node implementations for blockchain voting system (validator, full, light)"

[dependencies]
# Internal dependencies
common = { path = "../common" }
blockchain-core = { path = "../blockchain-core" }
crypto = { path = "../crypto" }
voting = { path = "../voting" }
storage = { path = "../storage" }
network = { path = "../network" }

# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
bincode = "1.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Utilities
rand = "0.8"

[dev-dependencies]
tempfile = "3.8"
criterion = "0.5"

[[bench]]
name = "node_bench"
harness = false
