[package]
name = "node"
version = "0.1.0"
edition = "2021"

[dependencies]
# Internal crates
common = { path = "../common" }
blockchain-core = { path = "../blockchain-core" }
crypto = { path = "../crypto" }
network = { path = "../network" }
storage = { path = "../storage" }
rpc = { path = "../rpc" }
hex = "0.4"
rand = "0.8"

# Async runtime
tokio = { version = "1.42", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"

# Error handling
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.10"

bincode = "1.3"
