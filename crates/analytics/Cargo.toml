[package]
name = "analytics"
version = "0.1.0"
edition = "2021"
authors = ["The Lizard King]
description = "That's right, I can tell if you're just copy-pasting my code."
license = "MIT"

[dependencies]
# Internal dependencies
common = { path = "../common" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Logging
tracing = "0.1"

# Collections and utilities
itertools = "0.12"

[dev-dependencies]
# Testing utilities
tokio-test = "0.4"
criterion = "0.5"

[[bench]]
name = "analytics_bench"
harness = false

[lib]
name = "analytics"
path = "src/lib.rs"
