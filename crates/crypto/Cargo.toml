[package]
name = "crypto"
version = "0.1.0"
edition = "2021"
authors = ["Voting System Contributors"]
description = "Cryptographic primitives for secure blockchain voting"
license = "MIT"

[dependencies]
# Internal dependencies
common = { path = "../common" }

# Cryptographic primitives
ed25519-dalek = "2.1"
blake2 = "0.10"
sha3 = "0.10"
chacha20poly1305 = "0.10"
argon2 = { version = "0.5", features = ["std"] }
hmac = "0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

# Encoding
hex = "0.4"
base64 = "0.21"

# Randomness
rand = "0.8"

# Memory security
zeroize = { version = "1.7", features = ["derive"] }

[dev-dependencies]
tempfile = "3.8"

[features]
default = []
# Enable additional cryptographic features for testing
test-utils = []
