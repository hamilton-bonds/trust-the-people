[package]
name = "storage"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Voting System Contributors"]
description = "Storage layer for blockchain voting system with hierarchical jurisdiction support"

[dependencies]
# Internal dependencies
common = { path = "../common" }
blockchain-core = { path = "../blockchain-core" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Database backends
sled = { version = "0.34", optional = true }
rocksdb = { version = "0.21", optional = true }

# Caching
lru = "0.12"

# Hashing
blake2 = "0.10"
sha3 = "0.10"

# Encoding
hex = "0.4"
base64 = "0.21"

# Compression
snap = "1.1"
zstd = { version = "0.13", optional = true }

# Async runtime (for potential async operations)
tokio = { version = "1.35", features = ["full"], optional = true }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Utilities
rand = "0.8"

[dev-dependencies]
tempfile = "3.8"
criterion = "0.5"

[features]
default = ["sled-backend"]
sled-backend = ["sled"]
rocksdb-backend = ["rocksdb"]
compression = ["zstd"]
async = ["tokio"]

[[bench]]
name = "storage_bench"
harness = false
