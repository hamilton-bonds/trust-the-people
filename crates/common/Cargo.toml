[package]
name = "common"
version = "0.1.0"
edition = "2021"
authors = ["Voting System Contributors"]
description = "Common types, errors, and utilities for the blockchain voting system"
license = "MIT"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
toml = "0.8"

# Cryptography
hex = "0.4"
blake2 = "0.10"
rand = "0.8"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Metrics
prometheus = "0.13"

# Time
chrono = "0.4"

[dev-dependencies]
# Testing
tokio-test = "0.4"
