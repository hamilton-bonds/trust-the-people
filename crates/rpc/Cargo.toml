[package]
name = "rpc"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Voting System Contributors"]
description = "JSON-RPC 2.0 server for blockchain voting system"

[dependencies]
# Internal dependencies
common = { path = "../common" }
blockchain-core = { path = "../blockchain-core" }
crypto = { path = "../crypto" }
voting = { path = "../voting" }
network = { path = "../network" }
storage = { path = "../storage" }

# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Encoding
hex = "0.4"
base64 = "0.21"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.8"
criterion = "0.5"

#[[bench]]
#name = "rpc_bench"
#harness = false
