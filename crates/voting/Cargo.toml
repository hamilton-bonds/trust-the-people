[package]
name = "voting"
version = "0.1.0"
edition = "2021"
authors = ["Voting System Contributors"]
description = "Voting system implementation for secure, private ballot casting"
license = "MIT"

[dependencies]
# Internal dependencies
common = { path = "../common" }
crypto = { path = "../crypto" }
blockchain-core = { path = "../blockchain-core" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

# Encoding
hex = "0.4"

# Randomness
rand = "0.8"

[dev-dependencies]
# None needed currently

[features]
default = []
